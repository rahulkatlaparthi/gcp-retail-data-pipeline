name: Retail Data Pipeline CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # CI - VALIDATE EVERYTHING
  # ==========================================================

  validate:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout GitHub repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # Install Python dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-beam[gcp]


      # ------------------------------------------------------
      # Validate ALL Python files dynamically
      # ------------------------------------------------------

      - name: Validate Python files
        run: |

          echo "=========================================="
          echo "VALIDATING PYTHON FILES"
          echo "=========================================="

          python_files=$(find dataflow dags \
            -type f \
            -name "*.py")

          if [ -z "$python_files" ]; then
            echo "No Python files found"
            exit 1
          fi

          for file in $python_files
          do
            echo "Checking: $file"

            python -m py_compile "$file"

            echo "PASS: $file"
          done


      # ------------------------------------------------------
      # Validate ALL SQL files dynamically
      # ------------------------------------------------------

      - name: Validate SQL files
        run: |

          echo "=========================================="
          echo "VALIDATING SQL FILES"
          echo "=========================================="

          sql_files=$(find sql \
            -type f \
            -name "*.sql")

          if [ -z "$sql_files" ]; then
            echo "No SQL files found"
            exit 1
          fi

          for file in $sql_files
          do
            echo "Checking: $file"

            test -s "$file"

            echo "PASS: $file"
          done


      # ------------------------------------------------------
      # Validate ALL CSV files dynamically
      # ------------------------------------------------------

      - name: Validate CSV files
        run: |

          echo "=========================================="
          echo "VALIDATING CSV FILES"
          echo "=========================================="

          csv_files=$(find data \
            -type f \
            -name "*.csv")

          if [ -z "$csv_files" ]; then
            echo "No CSV files found"
            exit 1
          fi

          for file in $csv_files
          do
            echo "Checking: $file"

            test -s "$file"

            echo "PASS: $file"
          done


      # ------------------------------------------------------
      # Show files
      # ------------------------------------------------------

      - name: Display project files
        run: |

          echo "=========================================="
          echo "DAGS"
          echo "=========================================="

          find dags \
            -type f \
            -name "*.py"


          echo "=========================================="
          echo "DATAFLOW"
          echo "=========================================="

          find dataflow \
            -type f


          echo "=========================================="
          echo "SQL"
          echo "=========================================="

          find sql \
            -type f \
            -name "*.sql"


          echo "=========================================="
          echo "DATA"
          echo "=========================================="

          find data \
            -type f


      # ------------------------------------------------------
      # CI SUCCESS
      # ------------------------------------------------------

      - name: CI validation completed
        run: |

          echo "=========================================="
          echo "CI VALIDATION SUCCESS"
          echo "=========================================="


  # ==========================================================
  # CD - DEPLOY TO CLOUD COMPOSER
  # ==========================================================

  deploy:

    needs: validate

    # Deploy ONLY after a push to main.
    # Pull requests only run CI validation.

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Authenticate GitHub Actions to Google Cloud
      #
      # These two values will be stored as GitHub Secrets:
      #
      # GCP_WORKLOAD_IDENTITY_PROVIDER
      # GCP_DEPLOY_SERVICE_ACCOUNT
      # ------------------------------------------------------

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}


      # ------------------------------------------------------
      # Setup gcloud
      # ------------------------------------------------------

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2


      # ------------------------------------------------------
      # Set GCP project
      # ------------------------------------------------------

      - name: Set GCP project
        run: |
          gcloud config set project qwiklabs-gcp-04-fdff43c11093


      # ------------------------------------------------------
      # Deploy ALL DAG files dynamically
      #
      # Any new .py file inside dags/ is automatically copied.
      # ------------------------------------------------------

      - name: Deploy all DAG files
        run: |

          echo "=========================================="
          echo "DEPLOYING DAG FILES"
          echo "=========================================="

          COMPOSER_BUCKET="gs://asia-south1-comp-35bb8f9f-bucket"

          dag_files=$(find dags \
            -type f \
            -name "*.py")

          if [ -z "$dag_files" ]; then
            echo "No DAG files found"
            exit 1
          fi

          for file in $dag_files
          do

            relative_path="${file#dags/}"

            echo "Deploying DAG: $file"

            gcloud storage cp \
              "$file" \
              "${COMPOSER_BUCKET}/dags/${relative_path}"

          done

          echo "All DAG files deployed."


      # ------------------------------------------------------
      # Deploy ALL SQL files dynamically
      #
      # Any new .sql file inside sql/ is automatically copied.
      # ------------------------------------------------------

      - name: Deploy all SQL files
        run: |

          echo "=========================================="
          echo "DEPLOYING SQL FILES"
          echo "=========================================="

          COMPOSER_BUCKET="gs://asia-south1-comp-35bb8f9f-bucket"

          sql_files=$(find sql \
            -type f \
            -name "*.sql")

          if [ -z "$sql_files" ]; then
            echo "No SQL files found"
            exit 1
          fi

          for file in $sql_files
          do

            relative_path="${file#sql/}"

            echo "Deploying SQL: $file"

            gcloud storage cp \
              "$file" \
              "${COMPOSER_BUCKET}/data/sql/${relative_path}"

          done

          echo "All SQL files deployed."


      # ------------------------------------------------------
      # Deployment verification
      # ------------------------------------------------------

      - name: Verify Composer files
        run: |

          COMPOSER_BUCKET="gs://asia-south1-comp-35bb8f9f-bucket"

          echo "=========================================="
          echo "DEPLOYED DAG FILES"
          echo "=========================================="

          gcloud storage ls \
            "${COMPOSER_BUCKET}/dags/"


          echo "=========================================="
          echo "DEPLOYED SQL FILES"
          echo "=========================================="

          gcloud storage ls \
            "${COMPOSER_BUCKET}/data/sql/"


          echo "=========================================="
          echo "CD DEPLOYMENT SUCCESS"
          echo "=========================================="
